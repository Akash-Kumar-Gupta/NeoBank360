<div class="container budget-wrapper">

  <!-- ✅ HEADER CARD -->
  <div class="budget-header mb-4">

    <div class="d-flex justify-content-between align-items-center">

      <div class="d-flex align-items-center gap-3">


        <div>
          <h2 class="budget-title mb-0">
            Bills Dashboard
          </h2>
        </div>

      </div>

      <button class="btn btn-primary" (click)="goToCreate()">
        + Add Bill
      </button>

    </div>

  </div>


  <!-- ✅ SUMMARY SECTION (STRONGER CARDS) -->
  <div class="row g-3 mb-4">

    <div class="col-md-4">
      <div class="summary-card-pro border-blue text-center">
        <div class="summary-title">Total Bills</div>
        <div class="summary-value">{{ bills.length }}</div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="summary-card-pro border-red text-center">
        <div class="summary-title">Pending</div>
        <div class="summary-value">
          {{ bills.filter(b => b.status === 'PENDING').length }}
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="summary-card-pro border-green text-center">
        <div class="summary-title">Paid</div>
        <div class="summary-value">
          {{ bills.filter(b => b.status === 'PAID').length }}
        </div>
      </div>
    </div>

  </div>


  <!-- ✅ BILL CARDS GRID -->
  <div class="row g-4">

    <div class="col-md-6 col-lg-4" *ngFor="let b of bills">

      <div class="card bill-card">

        <div class="card-body d-flex flex-column">

          <!-- TOP: TITLE + STATUS -->
          <div class="d-flex justify-content-between align-items-center mb-2">

            <h5 class="fw-bold mb-0">
              {{ b.name }}
            </h5>

            <span class="badge"
              [ngClass]="{
                'bg-success': b.status === 'PAID',
                'bg-danger': b.status === 'PENDING'
              }">
              {{ b.status }}
            </span>

          </div>

          <!-- AMOUNT -->
          <div class="bill-amount">
            ₹ {{ b.amount }}
          </div>

          <!-- INFO -->
          <div class="bill-info mt-2">
            <div>Category: {{ b.category }}</div>
            <div>Due: {{ b.dueDate }}</div>
          </div>

          <!-- SPACE PUSH -->
          <div class="mt-auto"></div>

          <!-- ACTION -->
          <button 
            *ngIf="b.status === 'PENDING'"
            class="btn btn-success w-100 mt-3"
            (click)="pay(b.id!)"
          >
            Mark Paid
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
