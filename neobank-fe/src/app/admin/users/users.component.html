<div class="container mt-4">
  <h2 class="mb-4">User Management</h2>

  <div *ngIf="loading" class="text-muted">
    Loading users...
  </div>

  <table
    class="table table-striped table-bordered"
    *ngIf="!loading"
  >
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.fullName }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role }}</td>

        <td>
          <span
            class="badge"
            [class.bg-success]="u.active"
            [class.bg-secondary]="!u.active"
          >
            {{ u.active ? 'Active' : 'Inactive' }}
          </span>
        </td>

        <td>
          <button
            *ngIf="!u.active"
            class="btn btn-success btn-sm me-2"
            (click)="activate(u.id)"
          >
            Activate
          </button>

          <button
            *ngIf="u.active"
            class="btn btn-danger btn-sm"
            (click)="deactivate(u.id)"
          >
            Deactivate
          </button>
        </td>
      </tr>

      <tr *ngIf="users.length === 0">
        <td colspan="5" class="text-center text-muted">
          No users found
        </td>
      </tr>
    </tbody>
  </table>
</div>
