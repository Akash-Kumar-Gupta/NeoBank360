<div class="loan-bg">

  <div class="container d-flex justify-content-center">

    <div class="loan-card">

      <h4 class="text-center mb-4">Create Loan Product</h4>

      <form (ngSubmit)="submit()" #form="ngForm">

        <!-- Product Name -->
        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control"
                 name="productName"
                 [(ngModel)]="loan.productName"
                 placeholder="Enter product name"
                 required>
        </div>

        <!-- Min Amount -->
        <div class="mb-3">
          <label class="form-label">Min Amount</label>
          <input type="number" class="form-control"
                 name="minAmount"
                 [(ngModel)]="loan.minAmount"
                 required>
        </div>

        <!-- Max Amount -->
        <div class="mb-3">
          <label class="form-label">Max Amount</label>
          <input type="number" class="form-control"
                 name="maxAmount"
                 [(ngModel)]="loan.maxAmount"
                 required>
        </div>

        <!-- Interest Rate -->
        <div class="mb-3">
          <label class="form-label">Interest Rate (%)</label>
          <input type="number" class="form-control"
                 name="annualInterestRate"
                 [(ngModel)]="loan.annualInterestRate"
                 required>
        </div>

        <!-- Allowed Tenures -->
        <div class="mb-3">
          <label class="form-label">Allowed Tenures</label>
          <input type="text" class="form-control"
                 name="allowedTenures"
                 [(ngModel)]="loan.allowedTenures"
                 placeholder="e.g. 12,24,36">
        </div>

        <!-- Active -->
        <div class="form-check mb-3">
          <input type="checkbox"
                 class="form-check-input"
                 name="active"
                 [(ngModel)]="loan.active">
          <label class="form-check-label">Active</label>
        </div>

        <!-- Button -->
        <button type="submit" class="btn loan-btn w-100">
          Save Product
        </button>

      </form>

    </div>

  </div>

</div>
