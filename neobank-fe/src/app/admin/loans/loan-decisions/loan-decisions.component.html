<div class="container mt-4">

  <h2 class="text-center mb-4">Loan Applications</h2>

  <div *ngIf="loading" class="text-center">
    <p>Loading applications...</p>
  </div>

  <table *ngIf="!loading" class="table table-bordered table-striped">

    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>User ID</th>
        <th>Product ID</th>
        <th>Amount</th>
        <th>Tenure (Months)</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let app of applications">

        <td>{{ app.id }}</td>
        <td>{{ app.userId }}</td>
        <td>{{ app.loanProductId }}</td>
        <td>₹ {{ app.requestedAmount }}</td>
        <td>{{ app.requestedTenureMonths }}</td>

        <td>
          <span *ngIf="app.status === 'PENDING'" class="badge bg-warning text-dark">
            PENDING
          </span>

          <span *ngIf="app.status === 'APPROVED'" class="badge bg-success">
            APPROVED
          </span>

          <span *ngIf="app.status === 'REJECTED'" class="badge bg-danger">
            REJECTED
          </span>
        </td>

        <td>
          <button
            class="btn btn-success btn-sm me-2"
            (click)="approve(app.id)"
            [disabled]="app.status !== 'PENDING'">
            Approve
          </button>

          <button
            class="btn btn-danger btn-sm"
            (click)="reject(app.id)"
            [disabled]="app.status !== 'PENDING'">
            Reject
          </button>
        </td>

      </tr>
    </tbody>

  </table>

  <div *ngIf="!loading && applications.length === 0" class="text-center mt-3">
    <p>No loan applications found.</p>
  </div>

</div>
