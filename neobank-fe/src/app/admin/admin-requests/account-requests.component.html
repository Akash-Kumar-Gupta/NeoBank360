<div class="container mt-4">
  <h2 class="mb-4">Account Opening Requests</h2>

  <div *ngIf="loading" class="text-muted">
    Loading requests...
  </div>

  <table class="table table-bordered table-striped" *ngIf="!loading">
    <thead>
      <tr>
        <th>Name</th>
        <th>Account Type</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Aadhaar</th>
        <th>PAN</th>
        <th>DOB</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of requests">
        <td>{{ r.fullName }}</td>
        <td>{{ r.accountType }}</td>
        <td>{{ r.email }}</td>
        <td>{{ r.phone }}</td>
        <td>{{ r.aadhaarNumber }}</td>
        <td>{{ r.panNumber }}</td>
        <td>{{ r.dob | date }}</td>
        <td>{{ r.address }}</td>

        <td class="d-flex gap-2">
          <button
            class="btn btn-success btn-sm"
            (click)="approve(r.id)"
          >
            Approve
          </button>

          <button
            class="btn btn-danger btn-sm"
            (click)="reject(r.id)"
          >
            Reject
          </button>
        </td>
      </tr>

      <tr *ngIf="requests.length === 0">
        <td colspan="9" class="text-center text-muted">
          No pending requests
        </td>
      </tr>
    </tbody>
  </table>
</div>
