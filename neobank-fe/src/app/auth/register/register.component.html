<div class="min-h-screen flex items-center justify-center bg-[#E9EEF4]">

  <div class="bg-white w-[380px] p-6 rounded-xl shadow-lg border border-gray-200">

    <h2 class="text-center text-xl font-bold text-gray-800 mb-5">
      NeoBank Registration
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

      <!-- FULL NAME -->
      <div>
        <label class="text-sm text-gray-500">Full Name</label>

        <input
          type="text"
          formControlName="fullName"
          placeholder="Enter your full name"
          class="w-full mt-1 px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <p class="text-red-500 text-xs mt-1"
           *ngIf="form.controls.fullName.touched && form.controls.fullName.invalid">
          Full name is required
        </p>
      </div>

      <!-- EMAIL -->
      <div>
        <label class="text-sm text-gray-500">Email</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full mt-1 px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <p class="text-red-500 text-xs mt-1"
           *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address
        </p>
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="text-sm text-gray-500">Password</label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full mt-1 px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <p class="text-red-500 text-xs mt-1"
           *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password must be at least 8 characters
        </p>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>
        <label class="text-sm text-gray-500">Confirm Password</label>

        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter your password"
          class="w-full mt-1 px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <p class="text-red-500 text-xs mt-1"
           *ngIf="form.touched && form.errors?.['passwordMismatch']">
          Passwords do not match
        </p>
      </div>

      <!-- REGISTER BUTTON -->
      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full py-2.5 rounded-md bg-[#1E40AF] text-white font-semibold hover:bg-[#3B82F6] transition shadow-md hover:shadow-lg">

        Register

      </button>

    </form>

    <!-- LOGIN LINK -->
    <p class="text-center text-sm text-gray-500 mt-4">
      Already have an account?
      <a routerLink="/login"
         class="text-[#1E40AF] font-medium hover:underline">
        Login here
      </a>
    </p>

  </div>

</div>
