<div class="min-h-screen flex items-center justify-center bg-[#E9EEF4]">

  <div class="bg-white w-[380px] p-6 rounded-xl shadow-lg">

    <h2 class="text-center text-xl font-bold text-gray-800 mb-5">
      NeoBank Login
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

      <!-- EMAIL -->
      <div>
        <label class="text-sm text-gray-500">Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Enter email"
          class="w-full mt-1 px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- PASSWORD -->
      <div class="relative">
        <label class="text-sm text-gray-500">Password</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter password"
          class="w-full mt-1 px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
          type="button"
          class="absolute right-2 top-9 text-gray-400"
          (click)="togglePasswordVisibility()">

          <i class="bi bi-eye"></i>

        </button>
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="w-full py-2 rounded-md bg-blue-800 text-white font-semibold hover:bg-blue-600 transition">

        Login

      </button>

    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Don’t have an account?
      <a routerLink="/register" class="text-blue-800 font-medium hover:underline">
        Register here
      </a>
    </p>

  </div>

</div>
