spring.application.name=neobank360

server.port=8080

# DATABASE 
spring.datasource.url=jdbc:mysql://localhost:3306/neobank_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=NeoBankHikariPool


spring.security.filter.order=10


#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=UTC

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

security.jwt.secret=neobank360_7f3c8e9b1a4d6f0e2c5b9a8d4e7f3c6b1a0e9d8c2f5b4a6e1d9c7a3b2
security.jwt.expiration-ms=86400000


logging.level.org.springframework=ERROR


